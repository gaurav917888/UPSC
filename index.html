<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Personal UPSC CSAT PYQ, mock test and performance analysis workspace.">
  <title>CSAT Command Centre</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="app-shell" id="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <div class="brand"><div class="brand-mark">C</div><div><strong>CSAT</strong><span>COMMAND CENTRE</span></div></div>
      <div class="nav-label">WORKSPACE</div>
      <nav id="main-nav">
        <button class="nav-item active" data-page="dashboard"><span class="nav-icon">⌂</span>Dashboard</button>
        <button class="nav-item" data-page="library"><span class="nav-icon">▤</span>PYQ Library</button>
        <button class="nav-item" data-page="practice"><span class="nav-icon">◎</span>Section Practice</button>
        <button class="nav-item" data-page="custom"><span class="nav-icon">＋</span>Create My Mock</button>
        <button class="nav-item" data-page="analysis"><span class="nav-icon">▥</span>PYQ Analysis</button>
      </nav>
      <div class="nav-label nav-label-spaced">YOUR PREPARATION</div>
      <nav>
        <button class="nav-item" data-page="analytics"><span class="nav-icon">↗</span>Performance</button>
        <button class="nav-item" data-page="bookmarks"><span class="nav-icon">☆</span>Bookmarks <span class="nav-count" id="bookmark-count">0</span></button>
        <button class="nav-item" data-page="mistakes"><span class="nav-icon">⚑</span>Mistake Book <span class="nav-count" id="mistake-count">0</span></button>
        <button class="nav-item" data-page="notes"><span class="nav-icon">▧</span>Personal Notes</button>
        <button class="nav-item" data-page="settings"><span class="nav-icon">⚙</span>Settings</button>
      </nav>
      <div class="sidebar-footer"><div class="local-pill"><span class="status-dot"></span> Local-first storage</div><small>Personal study workspace</small></div>
    </aside>

    <div class="main-column">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="mobile-menu" aria-label="Open navigation">☰</button>
        <div class="breadcrumb"><span>Workspace</span><span class="crumb-sep">/</span><strong id="breadcrumb-current">Dashboard</strong></div>
        <div class="top-actions">
          <label class="global-search"><span aria-hidden="true">⌕</span><input type="search" id="global-search" placeholder="Search questions, topics, notes…" aria-label="Global search"><kbd>⌘ K</kbd></label>
          <button class="icon-button" id="theme-toggle" aria-label="Toggle theme" title="Toggle theme">◐</button>
          <button class="avatar-button" id="settings-shortcut" aria-label="Open settings">CS</button>
        </div>
      </header>
      <main id="main-content" tabindex="-1"><div class="loading-state">Loading CSAT workspace…</div></main>
      <footer class="app-footer"><span>CSAT Command Centre</span><span id="storage-status">Progress saved on this device</span><a href="https://upsc.gov.in/examinations/previous-question-papers" target="_blank" rel="noopener">Official UPSC papers ↗</a></footer>
    </div>
  </div>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <dialog id="confirm-dialog" class="modal"><form method="dialog"><div class="modal-head"><h2 id="confirm-title">Confirm action</h2><button class="icon-button" value="cancel" aria-label="Close">×</button></div><p id="confirm-message"></p><div class="modal-actions"><button class="button button-secondary" value="cancel">Cancel</button><button class="button button-primary" id="confirm-accept" value="confirm">Confirm</button></div></form></dialog>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <script src="js/storage.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/exam-engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
